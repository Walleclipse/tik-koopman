[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tik-koopman"
version = "0.1.0"
description = "Tangent-Invariant Koopman: Koopman control whose stability certificate holds on the plant"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abulikemu Abuduweili" }, { name = "Changliu Liu" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["tik"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E731", "B008", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "I001"]
